name: Pruebas CRUD de lotes

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lotes:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Espejo público de la imagen oficial para evitar el límite de Docker Hub.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: qr_test
          POSTGRES_PASSWORD: qr_test
          POSTGRES_DB: qr_lotes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qr_test -d qr_lotes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://qr_test:qr_test@127.0.0.1:5432/qr_lotes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results/lotes.xml
      - name: Generar actualización web independiente
        run: python scripts/package_web_release.py --version "${GITHUB_SHA:0:12}"
      - uses: actions/upload-artifact@v4
        with:
          name: actualizacion-web
          path: dist/web/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-crud-lotes
          path: test-results/
